<ion-tabs>
  <ion-tab-bar slot="bottom" style="--background: #FFFFFF; border-top: 1px solid #E5E7EB; padding-bottom: env(safe-area-inset-bottom);">
    
    <!-- Tab 1: Add Book -->
    <ion-tab-button tab="tab1" style="--color: #9CA3AF; --color-selected: #4A7C59;">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Add Book</ion-label>
    </ion-tab-button>

    <!-- Tab 2: Library/Books -->
    <ion-tab-button tab="tab2" style="--color: #9CA3AF; --color-selected: #4A7C59;">
      <ion-icon name="library-outline"></ion-icon>
      <ion-label>Library</ion-label>
    </ion-tab-button>

    <!-- Tab 3: Pwede mong i-hide o palitan ng Settings kung wala namang laman -->
    <ion-tab-button tab="tab3" style="--color: #9CA3AF; --color-selected: #4A7C59;">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
