name: Deploy Ionic App Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, x64]
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build -t ionic-crud-latest .

      - name: Remove previous container
        run: |
          docker rm -f ionic-crud
          docker rm -f ionic-firebase-crud-container
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-crud-latest

      - name: Verify app
        shell: powershell  # <--- ITO ANG BINAGO NATIN (powershell instead of pwsh)
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest -Uri http://localhost:8100 -UseBasicParsing -TimeoutSec 3 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs ionic-crud
            exit 1
          }